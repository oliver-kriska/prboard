name: Unreleased

# Keeps a draft GitHub release named "unreleased" in sync with everything that
# has landed on main but is not in the latest vX.Y.Z tag. Open it any time to
# see what's queued for the next release. Nothing here publishes a real release
# — cutting a real tag is the `cut-release` flow (packaging/RELEASING.md).

on:
  push:
    branches: [main]
  # After a real release is published the queue is empty again; refresh (and
  # remove) the draft. Draft creation/deletion does not fire `released`, so this
  # cannot recurse.
  release:
    types: [released]
  workflow_dispatch:

concurrency:
  group: unreleased
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  draft:
    name: Refresh the "Unreleased" draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for git-cliff

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Render unreleased notes
        run: git cliff --config cliff.toml --unreleased --strip all -o UNRELEASED.md

      - name: Publish / clear the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Delete EVERY existing draft tagged "unreleased" by release id. A draft
          # has no real git tag, so `gh release delete unreleased` (which resolves
          # by tag) can't find it and silently fails — that left duplicate drafts
          # piling up. Deleting by id via the API is reliable and also cleans up
          # any duplicates a previous concurrent run may have created.
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name=="unreleased") | .id' \
          | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
            done

          # Empty (only whitespace) => nothing unreleased; leave no draft.
          if ! grep -q '[^[:space:]]' UNRELEASED.md 2>/dev/null; then
            echo "Nothing unreleased — no draft created."
            exit 0
          fi

          # Create one fresh draft whose body matches main's HEAD. The tag
          # 'unreleased' only materializes if a draft is ever published (it
          # isn't), so this leaves no stray tags.
          gh release create unreleased \
            --draft \
            --title "🚧 Unreleased (main @ ${GITHUB_SHA:0:7})" \
            --notes-file UNRELEASED.md \
            --target "${GITHUB_SHA}"

          echo "Draft 'unreleased' refreshed at ${GITHUB_SHA:0:7}."
