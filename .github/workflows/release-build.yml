name: Release build

# Builds the ad-hoc-signed Apple-silicon archive without publishing it. Release
# publication stays a separate, human-approved step in the cut-release flow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit or tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: macOS arm64 artifact
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Require an Apple-silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --locked

      - name: Bundle, clean, and verify app
        shell: bash
        run: |
          set -euo pipefail
          scripts/bundle-app.sh --stage-only
          xattr -cr target/bundle/prboard.app 2>/dev/null || true
          codesign --force --deep -s - target/bundle/prboard.app
          codesign --verify --deep --strict --verbose=2 target/bundle/prboard.app
          test "$(lipo -archs target/bundle/prboard.app/Contents/MacOS/prboard)" = arm64

      - name: Package artifact without Mac metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '
            /^\[package\]/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          test -n "$version"
          mkdir -p dist
          asset="prboard-v${version}-macos-arm64.tar.gz"
          COPYFILE_DISABLE=1 tar czf "dist/$asset" -C target/bundle prboard.app
          if tar tzf "dist/$asset" | grep -Eq '(^|/)\._'; then
            echo "AppleDouble metadata found in $asset" >&2
            exit 1
          fi
          shasum -a 256 "dist/$asset" > "dist/$asset.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: prboard-v${{ steps.package.outputs.version }}-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
